	<div class="row">
		<div class="col ml-5">
			<p>These boardgame clones are for personal use only, so this page is password protected.</p>
			<form id="unlock" class="form-inline" autocomplete="off">
				<input id="password" type="password" class="form-control mr-2" placeholder="Password" autofocus>
				<button type="submit" class="btn btn-primary btn-sm">Enter</button>
			</form>
			<p id="wrong" class="text-danger mt-2" style="display: none">Wrong password.</p>
		</div>
	</div>
</div>

<script>
// The password is never stored here: the games live in a folder named after
// the first 16 hex characters of the password's SHA-256 hash.
document.getElementById('unlock').addEventListener('submit', async function (event) {
	event.preventDefault();
	const text = document.getElementById('password').value.trim().toLowerCase();
	const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
	const hex = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
	const page = '/games/boardgames/' + hex.slice(0, 16) + '/index.html';
	const response = await fetch(page, {method: 'HEAD'});
	if (response.ok) {
		window.location.href = page;
	} else {
		document.getElementById('wrong').style.display = 'block';
	}
});
</script>
